name: Android build

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the runner's existing Java and Android SDK
        run: |
          set -euo pipefail
          test -x "${JAVA_HOME_17_X64:?}/bin/javac"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -f "$android_sdk/platforms/android-36/android.jar"
          test -x "$android_sdk/build-tools/36.0.0/aapt"
          test -x "$android_sdk/build-tools/36.0.0/apksigner"
          test -x "$android_sdk/build-tools/36.0.0/zipalign"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          printf 'ANDROID_HOME=%s\n' "$android_sdk" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$android_sdk" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/javac" -version
          # Use the SDK already supplied in the runner image. Do not install
          # packages or accept SDK license terms during this workflow.

      - name: Run tests, lint and build APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -Pandroid.builder.sdkDownload=false testDebugUnitTest lintDebug assembleRelease assembleDebug

      - name: Verify package metadata and debug signature
        run: |
          set -euo pipefail
          mkdir -p build
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > build/release-package.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk > build/release-alignment.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk > build/debug-signature.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk > build/APK-SHA256SUMS.txt

      - name: Upload APKs and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smart-construction-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            android/app/build/test-results/
            android/build/APK-SHA256SUMS.txt
            android/build/release-package.txt
            android/build/release-alignment.txt
            android/build/debug-signature.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
          include-hidden-files: false
